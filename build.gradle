plugins {
    id 'java'
}

group = 'fun.litmc'
version = '1.0.0'

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

processResources {
    filesMatching('plugin.yml') { expand(version: project.version) }
}
